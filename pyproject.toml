[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlab"
version = "0.2.0"
description = "Incremental AI conference paper catalogue with topic scoring and Obsidian sync."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pymupdf>=1.24",
  "openai>=1.40",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.scripts]
paperlab = "paperlab.cli:main"

[tool.setuptools.packages.find]
include = ["paperlab*"]

[tool.setuptools.package-data]
paperlab = ["templates/*.html"]
