name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[sync]"
      - name: Compile
        run: python -m compileall -q paperlab
      - name: Test
        run: python -m unittest discover -s tests
      - name: Reject runtime data and secrets
        run: |
          test ! -e .env
          test ! -e data/papers.db
          test -z "$(find pdfs reports -type f ! -name .gitkeep -print 2>/dev/null)"
