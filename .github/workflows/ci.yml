name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_boundaries.py

  application:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        project: [paperlab_local, paperlab_publish]
        include:
          - project: paperlab_local
            extra: sync
          - project: paperlab_publish
            extra: backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e "${{ matrix.project }}[${{ matrix.extra }}]"
      - run: python -m compileall -q "${{ matrix.project }}/src"
      - run: python -m unittest discover -s "${{ matrix.project }}/tests"

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paperlab_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: paperlab_app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  reject-runtime-data-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test ! -e .env
          test ! -e paperlab_local/.env
          test ! -e paperlab_publish/.env
          test ! -e paperlab_publish/deploy/server.env
          test ! -e data/papers.db
          test -z "$(find pdfs reports -type f ! -name .gitkeep -print 2>/dev/null)"
