# PaperLab v2: collect every paper from the catalogue, then score every topic.
models:
  scorer: gpt-4.1-mini
  extractor: gpt-4.1
  figure: gpt-4.1

defaults:
  year_range: [2022, 2027]
  citation_threshold: 0
  relevance_threshold: 0.5

catalog:
  year_range: [2022, 2027]
  incremental_lookback_years: 1
  venues:
    - NEURIPS
    - ICML
    - ICLR
    - AAAI
    - IJCAI
    - KDD
    - MLSYS
    - ACL
    - EMNLP
    - NAACL
    - CVPR
    - ICCV
    - ECCV
    - ISCA
    - MICRO
    - HPCA
    - ASPLOS
    - SIGCOMM
    - NSDI
    - INFOCOM
    - FAST
    - OSDI
    - SOSP

mcp:
  command: /Users/luchenda/.local/bin/uvx
  args: [paper-search-mcp]
  sources: [arxiv, semantic, openalex, crossref, dblp]
  timeout_seconds: 120

pdf_root: /Users/luchenda/tools/paperlab
db_path: data/papers.db
site_dir: site

obsidian:
  enabled: false
  vault_path: /Users/luchenda/papers/paperlab/obsidian
  folder: PaperLab

schedule:
  weekday: 1
  hour: 9
  minute: 0

topics:
  - name: ai-infra
    display_name: AI infra
    description: >-
      Systems and infrastructure for AI model training, inference and serving,
      including accelerators, scheduling, memory, storage and distributed execution.
    threshold: 0.5

  - name: ai-agent
    display_name: AI application (agent)
    description: >-
      LLM agents, tool use, planning, multi-agent systems, agent workflows,
      retrieval and long-term agent memory.
    threshold: 0.5

  - name: ai-network
    display_name: AI Network
    description: >-
      Networking required by AI clusters and large-model training or inference:
      interconnects, collectives, RDMA, congestion control, topology and communication
      scheduling. Exclude applying AI to conventional network management.
    threshold: 0.5

  - name: kv-cache
    display_name: KV cache
    description: >-
      Key-value cache management for model inference, including compression,
      offload, reuse, scheduling, eviction and tiered storage.
    threshold: 0.5

  - name: ai-inference
    display_name: AI inference
    description: >-
      Systems and techniques for efficient model inference and serving: decoding
      acceleration (speculative/prefix decoding), batching, scheduling, memory
      management, quantization and sparsity at serve time, disaggregated and
      distributed inference, MoE serving, and LLM serving systems. Exclude
      training-only work and networking-only work.
    threshold: 0.5
