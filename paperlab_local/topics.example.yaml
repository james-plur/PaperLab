# Portable PaperLab configuration. Relative paths resolve from this file.
defaults:
  year_range: [2022, 2027]
  citation_threshold: 0
  relevance_threshold: 0.5

catalog:
  year_range: [2022, 2027]
  incremental_lookback_years: 1
  venues:
    - NEURIPS
    - ICML
    - ICLR
    - AAAI
    - IJCAI
    - KDD
    - MLSYS
    - ACL
    - EMNLP
    - NAACL
    - CVPR
    - ICCV
    - ECCV
    - ISCA
    - MICRO
    - HPCA
    - ASPLOS
    - SIGCOMM
    - NSDI
    - INFOCOM
    - FAST
    - OSDI
    - SOSP

mcp:
  command: uvx
  args: [paper-search-mcp]
  sources: [arxiv, semantic, openalex, crossref, dblp]
  timeout_seconds: 120

pdf_root: .
db_path: data/papers.db

schedule:
  weekday: 1
  hour: 9
  minute: 0

related_papers:
  primary_source: openalex
  fallback_source: semantic_scholar
  result_limit: 10
  company_aliases:
    NVIDIA: [nvidia, 英伟达]
    ByteDance: [bytedance, byte dance, 字节跳动, 字节]
    Microsoft: [microsoft, 微软]
    OpenAI: [openai]
    Tencent: [tencent, 腾讯]
    Alibaba: [alibaba, aliyun, 阿里巴巴, 阿里云, 阿里]
    DeepSeek: [deepseek, 深度求索]
    Anthropic: [anthropic, claude]
    Google: [google, deepmind, 谷歌]
