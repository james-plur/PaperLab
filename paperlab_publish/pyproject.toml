[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlab-publish"
version = "0.5.0"
description = "Public PaperLab web application and incremental sync server."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pymupdf>=1.24",
  "openai>=1.40",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
backup = ["boto3>=1.35", "zstandard>=0.23"]

[project.scripts]
paperlab-publish = "paperlab_publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["paperlab_publish*"]

[tool.setuptools.package-dir]
"" = "src"
