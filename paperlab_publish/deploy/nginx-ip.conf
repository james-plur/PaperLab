server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 62.234.193.237;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name paperlab.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 62.234.193.237;

    ssl_certificate /etc/ssl/paperlab/paperlab.crt;
    ssl_certificate_key /etc/ssl/paperlab/paperlab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 52m;
    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paperlab.cloud;

    ssl_certificate /etc/letsencrypt/live/paperlab.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperlab.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 52m;
    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
